name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dabbabela
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dabbabela?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/dabbabela?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/dabbabela_test?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      CRON_SECRET: ci-cron
      SEED_ADMIN_EMAIL: owner@dabbabela.local
      SEED_ADMIN_PASSWORD: dabba-owner-2026
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d dabbabela -c "CREATE DATABASE dabbabela_test"
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - run: npm run build
      - name: Seed demo data for E2E
        run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
