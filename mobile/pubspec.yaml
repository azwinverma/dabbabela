name: dabba_bela
description: "Dabba Bela — lunch, on time. One role-aware app for customers, riders, kitchen staff and dispatchers."
publish_to: 'none'

# versionName+versionCode for the stores. Bump both for every store upload (see README "Release").
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

# Versions are pinned exactly (all released well before this app was written and compatible with Dart 3.7 /
# Flutter 3.29). Upgrade deliberately: `flutter pub outdated`, bump, run `flutter analyze && flutter test`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  dio: 5.8.0+1
  flutter_secure_storage: 9.2.4
  intl: 0.19.0
  qr_flutter: 4.1.0
  webview_flutter: 4.10.0
  image_picker: 1.1.2
  url_launcher: 6.3.1
  share_plus: 10.1.4
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  mocktail: 1.0.4
  # Config only (see `flutter_launcher_icons` below). Run `dart run flutter_launcher_icons` before a store build.
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-700.ttf
          weight: 700

# App icon from brand/app-icon.svg (rendered to assets/brand/app-icon.png). Generate the platform icons with
# `dart run flutter_launcher_icons` (offline; writes android/app/src/main/res/mipmap-* and the iOS AppIcon set).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F5EBD6"
  adaptive_icon_background: "#F5EBD6"
  adaptive_icon_foreground: "assets/brand/app-icon.png"
  min_sdk_android: 23
