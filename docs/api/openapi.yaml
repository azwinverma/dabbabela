        - name: scope
          in: query
          schema:
            type: string
            enum:
              - upcoming
              - past
              - all
            default: all
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Orders
      summary: Place a cart order (money-moving — Idempotency-Key required)
      description: Re-quoted on the server. `next = PAY` → POST /payments/{payment.id}/start (gateway) or /proof (bank); `DONE` → confirmed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lines
                - addressId
                - method
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    $ref: '#/components/schemas/CartLine'
                addressId:
                  type: string
                slotId:
                  type:
                    - string
                    - 'null'
                couponCode:
                  type:
                    - string
                    - 'null'
                  maxLength: 30
                method:
                  $ref: '#/components/schemas/PaymentMethod'
                notes:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
      responses:
        '201':
          description: Placed (or replayed — header Idempotent-Replayed true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlaceOrderResult'
        '400':
          description: Missing/invalid Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Same key still in progress (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed, order rejected (ORDER_REJECTED, CAPACITY_REJECTED, ACCOUNT_REJECTED) or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
