# Dabba Bela mobile API — OpenAPI 3.1. Edit this file, then run `npm run api:spec` to refresh the JSON served at /api/v1/openapi.json.
openapi: 3.1.0
info:
  title: Dabba Bela mobile API
  version: 1.0.0
  description: |
    REST API for the Dabba Bela Flutter app (customer, rider, kitchen, dispatcher). Same server functions, permission
    checks, kitchen scope and audit as the website. See docs/api/README.md for the auth flow, errors, idempotency,
    pagination and versioning.

    * Envelope: success `{ "data": … , "meta"?: { … } }`, failure `{ "error": { "code", "message", "fields"? } }`.
    * Money: integer **paisa** (100 paisa = Rs 1). Timestamps: ISO-8601 UTC. Service dates: `YYYY-MM-DD` (Asia/Kathmandu).
    * Auth: `Authorization: Bearer <token>` from sign-in. Cookies are ignored on /api/v1.
    * Money-moving POSTs require an `Idempotency-Key` header.
servers:
  - url: /api/v1
    description: Same host as the website (production https://<site>/api/v1)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Public
  - name: Account
  - name: Customer
  - name: Orders
  - name: Payments
  - name: Subscriptions
  - name: Wallet
  - name: Rider
  - name: Kitchen
  - name: Dispatch
paths:
  /openapi.json:
    get:
      tags:
        - Public
      summary: This specification as JSON
      security: []
      responses:
        '200':
          description: OpenAPI document (not wrapped in the envelope)
          content:
            application/json:
              schema:
                type: object
  /auth/sign-in:
    post:
      tags:
        - Auth
      summary: Email + password sign-in
      description: |
        Returns a bearer `token`, or — for accounts with an authenticator app (all staff when `staff2fa` is on, once enrolled) —
        `twoFactorRequired: true` and a single-use `challengeToken` for POST /auth/two-factor/verify. Rate limited per IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Signed in or challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SignInResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/two-factor/verify:
    post:
      tags:
        - Auth
      summary: Second sign-in step (TOTP or backup code)
      description: Rate-limited per IP and per challenge token (the pending sign-in), so rotating IPs gives no extra guesses (429 RATE_LIMITED).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challengeToken
                - code
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
                backup:
                  type: boolean
                  description: true = code is a backup code
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          description: INVALID_CODE or INVALID_CHALLENGE (expired / used — sign in again)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sign-up:
    post:
      tags:
        - Auth
      summary: Create a customer account and sign in
      description: |
        Same rules as the web register form. The app can't show the web's Turnstile bot check, so this endpoint is
        limited more strictly instead: the web sign-up limit per IP plus 3 per hour per IP and per email (429
        RATE_LIMITED). App attestation is a planned addition.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phone
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: Nepal mobile (98/97/96 + 8 digits)
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                companyCode:
                  type: string
                  maxLength: 20
                ref:
                  type: string
                  maxLength: 20
                  description: Referral code
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/AuthUser'
        '409':
          description: ACCOUNT_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sign-out:
    post:
      tags:
        - Auth
      summary: End this session (optionally drop this device's push token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceToken:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signedOut:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/otp/send:
    post:
      tags:
        - Auth
      summary: Send an SMS sign-in code (flag phoneOtp)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                      phone:
                        type: string
        '404':
          description: FEATURE_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify the SMS code (creates a phone-only account on first use)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Signed in or challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/SignInResult'
                      - type: object
                        properties:
                          isNew:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: FEATURE_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Email a reset link (same answer whether or not the account exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                      message:
                        type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags:
        - Auth
      summary: Set a new password with the emailed token (revokes every session)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
        '400':
          description: INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/two-factor/enable:
    post:
      tags:
        - Auth
      summary: Start authenticator-app enrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: otpauth URI + backup codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpURI:
                        type: string
                      backupCodes:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/two-factor/confirm:
    post:
      tags:
        - Auth
      summary: Finish enrolment with the first code — returns a NEW token (replace the stored one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      twoFactorEnabled:
                        type: boolean
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags:
        - Auth
      summary: My signed-in sessions (no tokens)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Auth
      summary: Sign out every other session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{id}:
    delete:
      tags:
        - Auth
      summary: Sign out one of my sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: integer
                      current:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      tags:
        - Auth
      summary: Who am I — role, permissions, kitchen scope, app sections, 2FA state, flags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /devices:
    get:
      tags:
        - Auth
      summary: My registered push devices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        platform:
                          type: string
                        appVersion:
                          type:
                            - string
                            - 'null'
                        tokenSuffix:
                          type: string
                        lastSeenAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Auth
      summary: Register / refresh this device's push token (moves it from another account)
      description: A token registered by another account moves to the caller; the move is audited and the previous account gets an in-app security notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - platform
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                    - IOS
                    - ANDROID
                    - WEB
                appVersion:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      platform:
                        type: string
                      registered:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
        - Auth
      summary: Unregister a push token (own only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      removed:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings:
    get:
      tags:
        - Public
      summary: Brand, contact, ordering rules, payment methods, app flags
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
  /menu:
    get:
      tags:
        - Public
      summary: Menu for a week or one date (company members get their company menu)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: One service day
        - name: week
          in: query
          schema:
            type: string
            format: date
          description: Any date in the week (Sunday start); default this week
        - name: locale
          in: query
          schema:
            type: string
            enum:
              - en
              - ne
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MenuWeek'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /boxes/{slug}:
    get:
      tags:
        - Public
      summary: One dabba (slug or id) with orderable dates
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      box:
                        $ref: '#/components/schemas/PublicBox'
                      offCompanyMenu:
                        type: boolean
                      dates:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            label:
                              type: string
                            price:
                              type: integer
                            soldOut:
                              type: boolean
                            remaining:
                              type:
                                - integer
                                - 'null'
                      allergyHits:
                        type: array
                        items:
                          type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /plans:
    get:
      tags:
        - Public
      summary: Active meal plans (today's prices)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
  /plans/{slug}:
    get:
      tags:
        - Public
      summary: One plan with start dates, day options, slots, payment methods
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/Plan'
                      startDates:
                        type: array
                        items:
                          type: string
                          format: date
                      dayOptions:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: object
                      slots:
                        type: array
                        items:
                          type: object
                      paymentMethods:
                        type: array
                        items:
                          type: string
                      kitchenId:
                        type:
                          - string
                          - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /coverage:
    get:
      tags:
        - Public
      summary: Coverage search (?q=) or address check (?area=…)
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: ward
          in: query
          schema:
            type: integer
        - name: municipality
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
      responses:
        '200':
          description: 'mode=search: matches + valleyWide; mode=address: serviceable, zone, fee, slots'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      tags:
        - Account
      summary: The caller's profile and food preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Account
      summary: Update name / phone / language / marketing opt-in (omitted fields unchanged)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                phone:
                  type: string
                  description: Nepal mobile 98/97/96 + 8 digits; changing it clears phoneVerified
                email:
                  type: string
                  description: Only for phone-only accounts (canSetEmail), once
                locale:
                  type: string
                  enum:
                    - en
                    - ne
                marketingOptIn:
                  type: boolean
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      profile:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /profile/preferences:
    patch:
      tags:
        - Account
      summary: Food preferences (diet, spice, allergies printed on labels, notes)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diet:
                  type: string
                  enum:
                    - ANY
                    - VEG
                    - EGG_OK
                    - VEGAN
                spiceTolerance:
                  type: integer
                  minimum: 0
                  maximum: 4
                allergies:
                  type: array
                  items:
                    type: string
                  description: Allergen codes; unknown codes ignored
                avoidOnionGarlic:
                  type: boolean
                dietaryNotes:
                  type: string
                  maxLength: 300
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /profile/notification-preferences:
    get:
      tags:
        - Account
      summary: Topic × channel notification switches
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Account
      summary: Replace all switches (unlisted = off). Marketing opt-in follows MARKETING email/SMS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preferences
              properties:
                preferences:
                  type: array
                  items:
                    $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      preferences:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationPreference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /addresses:
    get:
      tags:
        - Account
      summary: Saved addresses (default first) with their delivery zone
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Account
      summary: Add an address (max 10); zone linked from area/ward/municipality
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          $ref: '#/components/responses/AddressSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Account
      summary: Update an address (omitted fields keep their value; re-validated, zone re-linked)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          $ref: '#/components/responses/AddressSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
