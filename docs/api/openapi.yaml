  /rider/stops/{orderId}/deliver:
    post:
      tags:
        - Rider
      summary: Mark a stop delivered (OTP / cash / photo per settings)
      description: |
        Permission rider.edit. Riders: own current routes only; with flag deliveryOtp the customer's code is required
        (a wrong code → 422 DISPATCH_REJECTED, logged; after 5 wrong codes the stop locks → 423 HANDOFF_LOCKED until
        dispatch unlocks it from the dispatch board or confirms the hand-off itself; code tries are also rate-limited per
        rider → 429); with deliveryPhoto a `photo` is required; unpaid CASH orders need
        `cash` equal to the amount due (paisa). Staff acting from the app (dispatch.edit + kitchen scope) skip OTP/photo.
        Money-moving: Idempotency-Key required.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverInput'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeliverInput'
                - type: object
                  properties:
                    photo:
                      type: string
                      format: binary
                      description: JPG/PNG/WEBP/AVIF, ≤ 5 MB
      responses:
        '200':
          description: 'Delivered (a retry with the same key replays this with header Idempotent-Replayed: true)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                      number:
                        type: string
                      status:
                        type: string
                      paymentStatus:
                        type: string
                      photoUrl:
                        type:
                          - string
                          - 'null'
        '400':
          description: Missing / invalid Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: HANDOFF_LOCKED — too many wrong hand-off codes on this stop; call dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
