              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from /auth/sign-in, /auth/two-factor/verify, /auth/sign-up or /auth/otp/verify
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_\-:.]{8,80}$
      description: >-
        Fresh random id per user action; resend the same key on retry. Successful responses are replayed for 24 h (header
        Idempotent-Replayed: true).
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: meta.nextCursor of the previous page
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    Unauthorized:
      description: UNAUTHENTICATED — missing, expired or revoked token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN (missing permission), TWO_FACTOR_SETUP_REQUIRED (staff must enrol 2FA) or CORS_FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — doesn't exist, or isn't yours / not in your kitchens
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: VALIDATION_FAILED (fields per input) or a business-rule rejection (ORDER_REJECTED, PAYMENT_REJECTED, …) with a user-facing message
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: IDEMPOTENCY_IN_PROGRESS — first request with this key still running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Message:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
    AddressSaved:
      description: Saved
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
                  covered:
                    type: boolean
                  address:
                    $ref: '#/components/schemas/Address'
