# OpenAPI 3.1 fragment — Rider, Kitchen, Dispatch endpoints of /api/v1 (merged into docs/api/openapi.yaml).
# Shared components (Error, responses, IdempotencyKey, bearerAuth) are defined in the main file.
paths:
  /rider/routes:
    get:
      tags: [Rider]
      summary: Routes for a day (riders see their own; staff their kitchens')
      description: Permission rider.view. Dates outside the window (today−14 … today+7, Kathmandu) fall back to today.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      window: { $ref: "#/components/schemas/RiderWindow" }
                      readOnly: { type: boolean }
                      routes: { type: array, items: { $ref: "#/components/schemas/RiderRouteSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rider/days:
    get:
      tags: [Rider]
      summary: Route counts per day in the rider window
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      window: { $ref: "#/components/schemas/RiderWindow" }
                      days: { type: array, items: { type: object, properties: { date: { type: string, format: date }, routes: { type: integer } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rider/routes/{id}:
    get:
      tags: [Rider]
      summary: Route detail with stops in sequence (never includes the hand-off code)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RiderRouteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rider/routes/{id}/finish:
    post:
      tags: [Rider]
      summary: Finish a route (no stop may still be out)
      description: Permission rider.edit. Riders only their own route; other staff need dispatch.edit + kitchen scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { id: { type: string }, status: { type: string, enum: [PLANNED, OUT, DONE] }, cashCollected: { type: integer, description: paisa } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /rider/stops/{orderId}/deliver:
    post:
      tags: [Rider]
      summary: Mark a stop delivered (OTP / cash / photo per settings)
      description: |
        Permission rider.edit. Riders: own current routes only; with flag deliveryOtp the customer's code is required
        (a wrong code → 422 DISPATCH_REJECTED, logged); with deliveryPhoto a `photo` is required; unpaid CASH orders need
        `cash` equal to the amount due (paisa). Staff acting from the app (dispatch.edit + kitchen scope) skip OTP/photo.
        Money-moving: Idempotency-Key required.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverInput" }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: "#/components/schemas/DeliverInput" }
                - type: object
                  properties:
                    photo: { type: string, format: binary, description: "JPG/PNG/WEBP/AVIF, ≤ 5 MB" }
      responses:
        "200":
          description: "Delivered (a retry with the same key replays this with header Idempotent-Replayed: true)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId: { type: string }
                      number: { type: string }
                      status: { type: string }
                      paymentStatus: { type: string }
                      photoUrl: { type: [string, "null"] }
        "400": { description: Missing / invalid Idempotency-Key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /rider/stops/{orderId}/fail:
    post:
      tags: [Rider]
      summary: Mark a stop failed with a reason
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: "One of the route's failureReasons; \"Other\" needs detail" }
                detail: { type: string, maxLength: 300 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { orderId: { type: string }, number: { type: string }, status: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /kitchen/kitchens:
    get:
      tags: [Kitchen]
      summary: Kitchens in the caller's scope
      description: Permission kitchen.view or dispatch.view.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/KitchenRef" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /kitchen/production:
    get:
      tags: [Kitchen]
      summary: Production list for a kitchen-day (demand + orders)
      description: Permission kitchen.view. kitchenId defaults to the first kitchen in scope; another kitchen → 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: bufferPct, in: query, schema: { type: integer, minimum: 0, maximum: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kitchen: { $ref: "#/components/schemas/KitchenRef" }
                      date: { type: string, format: date }
                      summary: { type: object, properties: { orders: { type: integer }, meals: { type: integer }, pendingPayment: { type: integer }, allergenFlagged: { type: integer }, bufferPct: { type: integer } } }
                      boxes: { type: array, items: { type: object, properties: { name: { type: string }, meals: { type: integer } } } }
                      dishes: { type: array, items: { type: object, properties: { menuItemId: { type: string }, name: { type: string }, station: { type: string }, portions: { type: integer }, buffer: { type: integer }, total: { type: integer } } } }
                      diets: { type: array, items: { type: object, properties: { diet: { type: string }, meals: { type: integer } } } }
                      allergens: { type: array, items: { type: object, properties: { code: { type: string }, meals: { type: integer } } } }
                      orders: { type: array, items: { $ref: "#/components/schemas/KitchenOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /kitchen/orders/start:
    post:
      tags: [Kitchen]
      summary: Bulk start preparing (→ PREPARING)
      description: Permission kitchen.edit. Orders outside the caller's kitchens come back in `rejected`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orderIds], properties: { orderIds: { type: array, items: { type: string }, minItems: 1, maxItems: 200 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/StatusResult" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /kitchen/orders/pack:
    post:
      tags: [Kitchen]
      summary: Bulk packing checks (all four pass → PACKED)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  maxItems: 100
                  items: { allOf: [{ $ref: "#/components/schemas/PackCheck" }, { type: object, required: [orderId], properties: { orderId: { type: string } } }] }
      responses:
        "200":
          description: Per-order results (unknown / out-of-scope orders are not packed)
          content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { packed: { type: integer }, results: { type: array, items: { $ref: "#/components/schemas/PackResult" } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /kitchen/orders/{id}/pack:
    post:
      tags: [Kitchen]
      summary: Packing check for one order
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PackCheck" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PackResult" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /kitchen/batches:
    get:
      tags: [Kitchen]
      summary: Production batches of a kitchen-day + recorded stock shortages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kitchen: { $ref: "#/components/schemas/KitchenRef" }
                      date: { type: string, format: date }
                      batches: { type: array, items: { $ref: "#/components/schemas/Batch" } }
                      shortages: { type: array, items: { type: object, properties: { batchId: { type: string }, dish: { type: string }, ingredientId: { type: string }, name: { type: string }, unit: { type: string }, type: { type: string, enum: [USAGE, WASTE] }, shortage: { type: number }, at: { type: string, format: date-time } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /kitchen/batches/plan:
    post:
      tags: [Kitchen]
      summary: Plan / refresh batches from the forecast
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kitchenId, date], properties: { kitchenId: { type: string }, date: { type: string, format: date }, bufferPct: { type: integer, minimum: 0, maximum: 30, default: 5 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { created: { type: integer }, updated: { type: integer }, bufferPct: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /kitchen/batches/{id}/advance:
    post:
      tags: [Kitchen]
      summary: Move a batch PLANNED → COOKING → DONE (or CANCELLED with notes)
      description: DONE posts ingredient usage once; shortages are returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [COOKING, DONE, CANCELLED] }
                actualPortions: { type: integer, minimum: 0 }
                wastePortions: { type: integer, minimum: 0 }
                assignedTo: { type: string }
                notes: { type: string, description: Required to cancel }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, status: { type: string }, actualPortions: { type: [integer, "null"] }, wastePortions: { type: [integer, "null"] }, stockPosted: { type: boolean }, shortages: { type: array, items: { type: object } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /kitchen/qc:
    get:
      tags: [Kitchen]
      summary: QC checks of a kitchen-day
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { kitchen: { $ref: "#/components/schemas/KitchenRef" }, date: { type: string, format: date }, checks: { type: array, items: { $ref: "#/components/schemas/QcCheck" } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Kitchen]
      summary: Log a QC check (FAIL needs a note)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kitchenId, date, type, result]
              properties:
                kitchenId: { type: string }
                date: { type: string, format: date }
                type: { type: string, enum: [TEMPERATURE, TASTE, HYGIENE, PACKAGING, OTHER] }
                result: { type: string, enum: [PASS, FAIL] }
                value: { type: string, maxLength: 60 }
                note: { type: string, maxLength: 500 }
                batchId: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, createdAt: { type: string, format: date-time } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /kitchen/stock-alerts:
    get:
      tags: [Kitchen]
      summary: Read-only low-stock and expiring-lot alerts for a kitchen
      description: Permission kitchen.view or inventory.view.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: expiringDays, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 3 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kitchen: { $ref: "#/components/schemas/KitchenRef" }
                      alerts:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: [LOW_STOCK, EXPIRING_STOCK, EXPIRED_STOCK] }
                            severity: { type: string, enum: [info, warning, critical] }
                            entity: { type: string }
                            entityId: { type: string }
                            message: { type: string }
                            data: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dispatch/board:
    get:
      tags: [Dispatch]
      summary: Dispatch board for a kitchen-day (manifest slot × zone, unrouted, routes, riders, failed)
      description: Permission dispatch.view. Phones masked without customers.pii.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: slotId, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DispatchBoard" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dispatch/routes:
    post:
      tags: [Dispatch]
      summary: Create a route (optionally with rider and stops)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kitchenId, date, name]
              properties:
                kitchenId: { type: string }
                date: { type: string, format: date }
                name: { type: string, maxLength: 80 }
                slotId: { type: [string, "null"] }
                zoneId: { type: [string, "null"] }
                riderId: { type: [string, "null"] }
                orderIds: { type: array, items: { type: string }, maxItems: 200 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, name: { type: string }, status: { type: string }, riderId: { type: [string, "null"] }, stops: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /dispatch/routes/{id}/orders:
    post:
      tags: [Dispatch]
      summary: Add stops to a route (same kitchen-day; orders on other routes move)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orderIds], properties: { orderIds: { type: array, items: { type: string }, minItems: 1 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { routeId: { type: string }, added: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /dispatch/routes/{id}/rider:
    put:
      tags: [Dispatch]
      summary: Assign / reassign / clear the route's rider (audited)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [riderId], properties: { riderId: { type: [string, "null"] } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { routeId: { type: string }, riderId: { type: [string, "null"] }, changed: { type: boolean } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /dispatch/routes/{id}/start:
    post:
      tags: [Dispatch]
      summary: Dispatch the route (packed stops → OUT_FOR_DELIVERY)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { routeId: { type: string }, out: { type: integer }, notPacked: { type: integer }, rejected: { type: array, items: { type: object, properties: { id: { type: string }, reason: { type: string } } } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /dispatch/routes/{id}/complete:
    post:
      tags: [Dispatch]
      summary: Close a route (no stop still out)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { routeId: { type: string }, status: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /dispatch/orders/{orderId}/assignment:
    delete:
      tags: [Dispatch]
      summary: Take an order off its route
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { orderId: { type: string }, removedFrom: { type: [string, "null"] } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dispatch/auto-group:
    post:
      tags: [Dispatch]
      summary: Group every unrouted order onto one route per slot × zone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kitchenId, date], properties: { kitchenId: { type: string }, date: { type: string, format: date } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { routes: { type: integer }, stops: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dispatch/failed:
    get:
      tags: [Dispatch]
      summary: Failed deliveries of a kitchen-day with the last reason
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kitchenId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kitchen: { $ref: "#/components/schemas/KitchenRef" }
                      date: { type: string, format: date }
                      failed: { type: array, items: { $ref: "#/components/schemas/FailedDelivery" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dispatch/failed/{orderId}/resolve:
    post:
      tags: [Dispatch]
      summary: Retry or cancel (wallet credit) a failed delivery
      description: CANCEL credits the customer's wallet → Idempotency-Key required.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action, reason], properties: { action: { type: string, enum: [RETRY, CANCEL] }, reason: { type: string, minLength: 3, maxLength: 500 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { orderId: { type: string }, number: { type: string }, status: { type: string } } } } } } } }
        "400": { description: Missing / invalid Idempotency-Key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  schemas:
    KitchenRef:
      type: object
      properties: { id: { type: string }, name: { type: string }, code: { type: string } }
    RiderWindow:
      type: object
      properties: { from: { type: string, format: date }, to: { type: string, format: date }, today: { type: string, format: date } }
    RiderRouteSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [PLANNED, OUT, DONE] }
        slotLabel: { type: [string, "null"] }
        riderName: { type: [string, "null"] }
        stops: { type: integer }
        stopsDone: { type: integer }
        cashCollected: { type: integer, description: paisa }
        readOnly: { type: boolean }
    RiderStop:
      type: object
      properties:
        sequence: { type: integer }
        orderId: { type: string }
        number: { type: string }
        code: { type: string, description: Short label code (not the hand-off OTP) }
        status: { type: string }
        canAct: { type: boolean }
        placeName: { type: [string, "null"] }
        addressLine: { type: string }
        area: { type: string }
        ward: { type: [integer, "null"] }
        landmark: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        contactName: { type: string }
        contactPhone: { type: string }
        contactPhoneDisplay: { type: string }
        allergenNote: { type: [string, "null"] }
        items: { type: array, items: { type: object, properties: { name: { type: string }, quantity: { type: integer } } } }
        paymentMethod: { type: [string, "null"] }
        paymentStatus: { type: string }
        cashDue: { type: integer, description: paisa to collect (0 unless unpaid CASH) }
    RiderRouteDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        status: { type: string }
        slotLabel: { type: [string, "null"] }
        cashCollected: { type: integer }
        readOnly: { type: boolean }
        openStops: { type: integer }
        requires: { type: object, properties: { otp: { type: boolean }, photo: { type: boolean } } }
        failureReasons: { type: array, items: { type: string } }
        stops: { type: array, items: { $ref: "#/components/schemas/RiderStop" } }
    DeliverInput:
      type: object
      properties:
        otp: { type: string, description: "Customer's hand-off code (digits)" }
        cash: { type: integer, description: Cash collected in paisa (unpaid CASH orders; must equal cashDue) }
        note: { type: string, maxLength: 300 }
    KitchenOrder:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string }
        deliveryDate: { type: string, format: date }
        slotLabel: { type: [string, "null"] }
        area: { type: string }
        placeName: { type: [string, "null"] }
        customerName: { type: string }
        allergenNote: { type: [string, "null"] }
        allergenWarning: { type: object, properties: { contains: { type: array, items: { type: string } }, customerNote: { type: [string, "null"] } } }
        ticketPrinted: { type: boolean }
        lastPackingCheck: { type: [object, "null"], properties: { ok: { type: boolean }, note: { type: [string, "null"] } } }
        items: { type: array, items: { type: object, properties: { name: { type: string }, quantity: { type: integer }, diet: { type: string }, customizations: { type: array, items: { type: string } } } } }
    StatusResult:
      type: object
      properties:
        changed: { type: array, items: { type: string } }
        rejected: { type: array, items: { type: object, properties: { id: { type: string }, reason: { type: string } } } }
    PackCheck:
      type: object
      required: [itemsOk, labelOk, allergenOk, sealedOk]
      properties:
        itemsOk: { type: boolean }
        labelOk: { type: boolean }
        allergenOk: { type: boolean }
        sealedOk: { type: boolean }
        note: { type: string, maxLength: 300 }
    PackResult:
      type: object
      properties:
        orderId: { type: string }
        number: { type: [string, "null"] }
        packed: { type: boolean }
        reason: { type: [string, "null"] }
    Batch:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        menuItemId: { type: string }
        dish: { type: string }
        station: { type: [string, "null"] }
        status: { type: string, enum: [PLANNED, COOKING, DONE, CANCELLED] }
        plannedPortions: { type: integer }
        bufferPortions: { type: integer }
        actualPortions: { type: [integer, "null"] }
        wastePortions: { type: [integer, "null"] }
        assignedTo: { type: [string, "null"] }
        stockPosted: { type: boolean }
        notes: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    QcCheck:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        type: { type: string }
        result: { type: string, enum: [PASS, FAIL] }
        value: { type: [string, "null"] }
        note: { type: [string, "null"] }
        batchId: { type: [string, "null"] }
        dish: { type: [string, "null"] }
        actorId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    DispatchOrder:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string }
        contactName: { type: string }
        contactPhone: { type: string, description: Masked without customers.pii }
        meals: { type: integer }
        paymentMethod: { type: [string, "null"] }
        cashDue: { type: integer }
        route: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
    FailedDelivery:
      type: object
      properties:
        orderId: { type: string }
        number: { type: string }
        deliveryDate: { type: string, format: date }
        contactName: { type: string }
        contactPhone: { type: string }
        area: { type: string }
        placeName: { type: [string, "null"] }
        route: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        reason: { type: [string, "null"] }
        failedAt: { type: [string, "null"], format: date-time }
    DispatchBoard:
      type: object
      properties:
        kitchen: { $ref: "#/components/schemas/KitchenRef" }
        date: { type: string, format: date }
        summary: { type: object, properties: { orders: { type: integer }, handOffPoints: { type: integer }, unrouted: { type: integer }, out: { type: integer }, failed: { type: integer }, changedAfterRouting: { type: integer } } }
        groups:
          type: array
          items:
            type: object
            properties:
              slot: { type: string }
              zoneId: { type: [string, "null"] }
              zone: { type: string }
              stops:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    placeName: { type: [string, "null"] }
                    area: { type: string }
                    landmark: { type: [string, "null"] }
                    company: { type: [string, "null"] }
                    office: { type: [string, "null"] }
                    instructions: { type: [string, "null"] }
                    meals: { type: integer }
                    cash: { type: integer }
                    orders: { type: array, items: { $ref: "#/components/schemas/DispatchOrder" } }
        unrouted: { type: array, items: { $ref: "#/components/schemas/DispatchOrder" } }
        routes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              slotId: { type: [string, "null"] }
              slotLabel: { type: [string, "null"] }
              zoneId: { type: [string, "null"] }
              rider: { type: [object, "null"], properties: { id: { type: string }, name: { type: string }, phone: { type: string } } }
              cost: { type: [integer, "null"] }
              startedAt: { type: [string, "null"], format: date-time }
              completedAt: { type: [string, "null"], format: date-time }
              cash: { type: [object, "null"], properties: { expected: { type: integer }, collected: { type: integer }, handedIn: { type: [integer, "null"] }, variance: { type: [integer, "null"] } } }
              stops: { type: array, items: { type: object, properties: { sequence: { type: integer }, orderId: { type: string }, number: { type: string }, status: { type: string }, area: { type: string }, placeName: { type: [string, "null"] }, contactName: { type: string }, changed: { type: [array, "null"], items: { type: string } } } } }
        riders: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, phone: { type: string }, vehicle: { type: [string, "null"] }, zoneIds: { type: array, items: { type: string } }, available: { type: boolean } } } }
        slots: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, startTime: { type: string }, endTime: { type: string } } } }
        zones: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        failed: { type: array, items: { type: object } }
