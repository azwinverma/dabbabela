<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100mm" height="65mm" role="img" aria-label="Dabba label template">
  <title>Dabba label template (100 × 65 mm thermal label). Fields in {braces} are filled by the kitchen label printer.</title>
  <rect x="2" y="2" width="396" height="256" rx="10" fill="#fff" stroke="#27221D" stroke-width="3"/>
  <g transform="translate(14 12) scale(.62)"><rect x="28.5" y="6" width="7" height="5" rx="2" fill="#27221D"/><path d="M10 31a22 22 0 0 1 44 0z" fill="#E3A83B" stroke="#27221D" stroke-width="3" stroke-linejoin="round"/><path d="M32 13.5v3M17 23l2.2 1.7M47 23l-2.2 1.7" stroke="#27221D" stroke-width="2.4" stroke-linecap="round"/><path d="M32 29V18.5M32 29h6.5" stroke="#27221D" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="29" r="2.4" fill="#27221D"/><rect x="9" y="33" width="46" height="25" rx="6" fill="#8B2923" stroke="#27221D" stroke-width="3"/><path d="M9.5 45.5h45" stroke="#F5EBD6" stroke-width="2.4"/><rect x="27" y="41.5" width="10" height="8" rx="2" fill="#F5EBD6" stroke="#27221D" stroke-width="2.2"/></g>
  <text x="60" y="38" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#27221D">Dabba Bela</text>
  <text x="386" y="30" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#27221D">{Delivery date} · {Slot}</text>
  <text x="386" y="46" text-anchor="end" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#27221D">{Zone / route}</text>
  <line x1="14" y1="58" x2="386" y2="58" stroke="#27221D" stroke-width="1.5"/>
  <text x="14" y="92" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#27221D">{CODE}</text>
  <text x="14" y="114" font-family="Arial, sans-serif" font-size="15" fill="#27221D">{Name or alias} · {Order no.}</text>
  <text x="14" y="140" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#27221D">{Dabba name} × {qty}</text>
  <text x="14" y="160" font-family="Arial, sans-serif" font-size="12" fill="#4A423A">{Swaps / notes}</text>
  <rect x="14" y="172" width="70" height="22" rx="4" fill="#3B6245"/>
  <text x="49" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#fff">{VEG / NON-VEG}</text>
  <rect x="14" y="200" width="282" height="46" rx="6" fill="#F3DEDA" stroke="#8B2923" stroke-width="2"/>
  <text x="24" y="219" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#6C1F1A">ALLERGENS: {list}</text>
  <text x="24" y="236" font-family="Arial, sans-serif" font-size="10.5" fill="#6C1F1A">CUSTOMER AVOIDS: {declared allergies} · shared kitchen</text>
  <rect x="306" y="166" width="80" height="80" fill="none" stroke="#27221D" stroke-dasharray="4 3"/>
  <text x="346" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#776B5E">{QR}</text>
</svg>
